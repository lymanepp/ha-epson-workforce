<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="Author" content="SEIKO EPSON">
<title>WF-2510 Series</title>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 class="font-size-14em">
      <span class="header">WF-2510 Series</span>
    </h1>
  </div>
  <div class="section">
    <h2>Informazioni sulla stampante</h2>
    <div id="info-main">
      <div class="information-first">
        <form method="get" name="form_select_language" action="./INDEX.HTML">
          <select class="list-full text" name="SEL_LANG">
            <option value="1">English</option>
            <option value="3" selected>Italiano</option>
          </select>
        </form>
      </div>
      <div class="information">
        <p class="clearfix"><span>Disponibile.</span></p>
      </div>
      <ul class="information-last clearfix">
        <li class="tank">
          <div class="tank"><img class="color" src="../../IMAGE/Ink_K.PNG" height="44"></div>
          <div class="clrname">BK</div>
        </li>
        <li class="tank">
          <div class="tank"><img class="color" src="../../IMAGE/Ink_Y.PNG" height="21"></div>
          <div class="clrname">Y</div>
        </li>
        <li class="tank">
          <div class="tank"><img class="color" src="../../IMAGE/Ink_M.PNG" height="20"></div>
          <div class="clrname">M</div>
        </li>
        <li class="tank">
          <div class="tank"><img class="color" src="../../IMAGE/Ink_C.PNG" height="18"></div>
          <div class="clrname">C</div>
        </li>
      </ul>
    </div>
    <div id="info-network">
      <table style="border-collapse: collapse; width: 100%;">
        <tr class="item clearfix"><td class="item-key"><bdi>Nome stampante</bdi>&nbsp;:</td><td class="item-value">EPSONXXXXXX</td></tr>
        <tr class="item clearfix"><td class="item-key"><bdi>Stato connessione</bdi>&nbsp;:</td><td class="item-value">Connessione wireless-72Mbps</td></tr>
        <tr class="item clearfix"><td class="item-key"><bdi>Forza segnale</bdi>&nbsp;:</td><td class="item-value">Eccellente</td></tr>
        <tr class="item clearfix"><td class="item-key"><bdi>Indirizzo IP</bdi>&nbsp;:</td><td class="item-value">XX.XX.XX.XX</td></tr>
        <tr class="item clearfix"><td class="item-key"><bdi>SSID</bdi>&nbsp;:</td><td class="item-value">XXXXXX</td></tr>
        <tr class="item-last clearfix"><td class="item-key"><bdi>Indirizzo MAC</bdi>&nbsp;:</td><td class="item-value">XX:XX:XX:XX:XX:XX</td></tr>
      </table>
    </div>
  </div>
</div>
</body>
</html>
